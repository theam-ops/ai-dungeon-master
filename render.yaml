services:
  - type: web
    name: ai-dungeon-master
    runtime: docker
    plan: free
    healthCheckPath: /healthz

    envVars:
      # Set this, or anyone who finds the URL can play on your credit.
      - key: APP_PASSWORD
        sync: false

      # One of these has to be set or the DM cannot narrate. A Gemini key is free
      # (aistudio.google.com/apikey); an Anthropic key is billed per token.
      # NOTE: the "Claude Pro/Max (this machine)" backend does NOT work here. It drives
      # the Claude Code installed on the host, and there is none in a datacentre - a
      # deployed copy needs a key. `python launch.py --share` is the route that keeps a
      # subscription running the table.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Signs the cookie that says which character is yours. Pinned rather than
      # generated, so a redeploy does not log the whole table out.
      - key: SESSION_SECRET
        sync: false

# ── What "free" costs you ───────────────────────────────────────────────────
# The free plan has no persistent disk and sleeps after ~15 minutes of no traffic.
# So:
#   * campaigns, characters, uploaded art and imported notes are wiped by a redeploy
#     and by a sleep. Treat the instance as disposable and use Export in the app for
#     anything you want to keep - the .zip carries the images and documents too.
#   * the first visit after a sleep takes the better part of a minute to answer.
#
# To keep data instead, move to a paid instance and add these back:
#
#   plan: starter
#   disk:
#     name: data
#     mountPath: /data
#     sizeGB: 1
#
# ...along with these two env vars, which are what actually put the data on the disk:
#
#   - key: DND_DB
#     value: /data/campaign.db
#   - key: DND_MEDIA
#     value: /data/media
